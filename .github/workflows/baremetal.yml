name: Baremetal QEMU

on:
  push:
    branches: [master, master-next]
  pull_request:
    branches: [master, master-next]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      oe_branch:
        description: "Upstream selection (master/scarthgap), or branch in both GitHub forks"
        type: string
        default: ""
      use_github_forks:
        description: "Use ahcbb6 OE-Core and BitBake forks (branch defaults to this branch)"
        type: boolean
        default: false
      bitbake_target:
        description: "Override image targets, space-separated"
        type: string
        default: ""
      extra_localconf:
        description: "Additional local.conf settings"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: baremetal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_BUILD_DIR: ${{ github.workspace }}/build
  CI_ARTIFACTS: ${{ github.workspace }}/artifacts
  CI_SSTATE: ${{ github.workspace }}/sstate-cache
  CI_SSTATE_MIRROR: ${{ github.workspace }}/sstate-mirror
  CI_DOWNLOADS: ${{ github.workspace }}/downloads
  CI_BRANCH: ${{ github.base_ref || github.ref_name }}
  OE_BRANCH: ${{ inputs.oe_branch || '' }}
  USE_GITHUB_FORKS: ${{ inputs.use_github_forks || false }}
  EXTRA_LOCALCONF: ${{ inputs.extra_localconf || '' }}

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native components and downloads
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    env:
      MACHINE: qemuarm64
      CI_KIND: native
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Prepare hosted runner
        run: bash source/CI/prepare-runner.sh

      - name: Restore ARM64 sstate
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CI_SSTATE }}
          key: sstate-v1-ubuntu26-qemuarm64-${{ env.CI_BRANCH }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sstate-v1-ubuntu26-qemuarm64-${{ env.CI_BRANCH }}-run-

      - name: Separate restored mirror from new sstate
        run: |
          mv "$CI_SSTATE" "$CI_SSTATE_MIRROR"
          mkdir "$CI_SSTATE"

      - name: Configure BitBake
        run: bash source/CI/setup-build.sh

      - name: Build native components and fetch sources
        id: build
        timeout-minutes: 300
        run: |
          source openembedded-core/oe-init-build-env "$CI_BUILD_DIR"
          bitbake baremetal-helloworld -g 2>&1 | tee "$CI_ARTIFACTS/bitbake.log"
          mapfile -t targets < <(grep -- '-native$' pn-buildlist | sort -u)
          if (( ${#targets[@]} == 0 )); then
            echo "No native recipes found in pn-buildlist" >&2
            exit 1
          fi
          bitbake "${targets[@]}" 2>&1 | tee -a "$CI_ARTIFACTS/bitbake.log"
          bitbake baremetal-helloworld --runall fetch 2>&1 | tee -a "$CI_ARTIFACTS/bitbake.log"

      - name: Package native sstate and downloads
        id: native-artifacts
        if: ${{ always() && !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          python3 source/CI/artifacts.py sstate "$CI_SSTATE" "$CI_SSTATE_MIRROR"
          python3 source/CI/artifacts.py archive "$CI_SSTATE" "$CI_ARTIFACTS/native-sstate.tar.zst"
          python3 source/CI/artifacts.py archive "$CI_DOWNLOADS" "$CI_ARTIFACTS/native-downloads.tar.zst"

      - name: Upload native sstate
        if: ${{ always() && !cancelled() && steps.native-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-artifacts
          path: ${{ env.CI_ARTIFACTS }}/native-sstate.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload native downloads
        if: ${{ always() && !cancelled() && steps.native-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-downloads
          path: ${{ env.CI_ARTIFACTS }}/native-downloads.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Collect diagnostics
        if: ${{ always() && !cancelled() }}
        run: |
          python3 source/CI/artifacts.py logs "$CI_BUILD_DIR" "$CI_ARTIFACTS"
          df -h

      - name: Upload diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: logs-native
          path: |
            ${{ env.CI_ARTIFACTS }}/revisions.txt
            ${{ env.CI_ARTIFACTS }}/bitbake.log
            ${{ env.CI_ARTIFACTS }}/diagnostics.tar.zst
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1

  build:
    name: Baremetal images (${{ matrix.machine }})
    needs: native
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: qemuarm
            artifact: qemuarm
          - machine: qemuarm64
            artifact: qemuarm64
          - machine: qemuriscv64
            artifact: qemuriscv64
          - machine: qemuriscv32
            artifact: qemuriscv32
          - machine: qemux86
            artifact: qemux86
          - machine: qemux86-64
            artifact: qemux86_64
    env:
      MACHINE: ${{ matrix.machine }}
      CI_KIND: images
      BBTARGET: ${{ inputs.bitbake_target || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Prepare hosted runner
        run: bash source/CI/prepare-runner.sh

      - name: Restore sstate
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CI_SSTATE }}
          key: sstate-v1-ubuntu26-${{ matrix.artifact }}-${{ env.CI_BRANCH }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sstate-v1-ubuntu26-${{ matrix.artifact }}-${{ env.CI_BRANCH }}-run-

      - name: Separate restored mirror from new sstate
        run: |
          mv "$CI_SSTATE" "$CI_SSTATE_MIRROR"
          mkdir "$CI_SSTATE"

      - name: Download native sstate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: native-artifacts
          path: ${{ env.CI_ARTIFACTS }}/native

      - name: Download native sources
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: native-downloads
          path: ${{ env.CI_ARTIFACTS }}/native

      - name: Unpack native sstate and downloads
        run: |
          tar --zstd -xf "$CI_ARTIFACTS/native/native-sstate.tar.zst" -C "$CI_SSTATE"
          tar --zstd -xf "$CI_ARTIFACTS/native/native-downloads.tar.zst" -C "$CI_DOWNLOADS"
          rm -- "$CI_ARTIFACTS/native/native-sstate.tar.zst" "$CI_ARTIFACTS/native/native-downloads.tar.zst"

      - name: Configure BitBake
        run: bash source/CI/setup-build.sh

      - name: Build baremetal images
        id: build
        timeout-minutes: 300
        run: |
          source openembedded-core/oe-init-build-env "$CI_BUILD_DIR"
          if [[ -n $BBTARGET ]]; then
            read -r -a targets <<< "$BBTARGET"
          else
            targets=(mc::baremetal-helloworld mc:bare:baremetal-helloworld)
            case "$MACHINE" in
              qemuarm|qemuarm64|qemuriscv32|qemuriscv64)
                targets+=(mc:pico:picolibc-helloworld) ;;
            esac
          fi
          if (( ${#targets[@]} == 0 )); then
            echo "No BitBake image targets specified" >&2
            exit 1
          fi
          bitbake "${targets[@]}" 2>&1 | tee "$CI_ARTIFACTS/bitbake.log"

      - name: Collect images
        if: ${{ always() && !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: python3 source/CI/artifacts.py images "$CI_BUILD_DIR" "$CI_ARTIFACTS/images" "$MACHINE"

      - name: Upload images
        if: ${{ always() && !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.machine }}
          path: ${{ env.CI_ARTIFACTS }}/images/*
          if-no-files-found: error
          retention-days: 1

      - name: Collect diagnostics
        if: ${{ always() && !cancelled() }}
        run: |
          python3 source/CI/artifacts.py logs "$CI_BUILD_DIR" "$CI_ARTIFACTS"
          df -h

      - name: Upload diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: logs-${{ matrix.machine }}
          path: |
            ${{ env.CI_ARTIFACTS }}/revisions.txt
            ${{ env.CI_ARTIFACTS }}/bitbake.log
            ${{ env.CI_ARTIFACTS }}/diagnostics.tar.zst
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1

      - name: Make sstate snapshot self-contained
        id: sstate-snapshot
        if: ${{ always() && !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: python3 source/CI/artifacts.py sstate "$CI_SSTATE" "$CI_SSTATE_MIRROR"

      - name: Save sstate
        if: ${{ always() && !cancelled() && steps.sstate-snapshot.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CI_SSTATE }}
          key: sstate-v1-ubuntu26-${{ matrix.artifact }}-${{ env.CI_BRANCH }}-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package sstate artifact
        if: ${{ always() && !cancelled() && steps.sstate-snapshot.outcome == 'success' }}
        run: python3 source/CI/artifacts.py archive "$CI_SSTATE" "$CI_ARTIFACTS/sstate.tar.zst"

      - name: Upload sstate artifact
        if: ${{ always() && !cancelled() && steps.sstate-snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SState-${{ matrix.artifact }}
          path: ${{ env.CI_ARTIFACTS }}/sstate.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
